$font = JetBrainsMonoNL Nerd Font
$text = rgb(245, 245, 245)
$text_dim = rgba(230, 230, 230, 0.8)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/joy_division.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = $font
    position = 0, 275
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.6)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text_dim
    font_size = 24
    font_family = $font
    position = 0, 175
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = Hyprland 
    color = $text
    font_size = 25
    font_family = $font
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(230, 230, 230, 0.7)
    font_size = 16
    font_family = $font
    position = 30, 30
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
}

input-field {
    monitor =
    size = 360, 62
    outline_thickness = 2
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(23, 119, 209, 0.9)
    inner_color = rgba(8, 10, 16, 0.55)
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_color = rgb(220, 60, 60)
    check_color = rgb(60, 200, 130)
    capslock_color = rgb(240, 180, 60)
    numlock_color = rgb(240, 180, 60)
    bothlock_color = rgb(240, 180, 60)
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.55)
}
